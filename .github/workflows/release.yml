name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: ubuntu-latest
            name: linux-x64
          - os: macos-latest
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --release
      - name: Package (Windows zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force pkg\data | Out-Null
          Copy-Item -Force target\release\vortexa.exe pkg\vortexa.exe
          Copy-Item -Force LICENSE pkg\LICENSE
          Copy-Item -Force README.md pkg\README.md
          Copy-Item -Force data\.gitkeep pkg\data\.gitkeep
          Compress-Archive -Force -Path @('pkg\vortexa.exe','pkg\LICENSE','pkg\README.md','pkg\data') `
            -DestinationPath vortexa-${{ matrix.name }}.zip
          Get-Item vortexa-${{ matrix.name }}.zip | Select-Object Name, Length
      - name: Package (Unix zip)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -e
          mkdir -p pkg/data
          cp target/release/vortexa pkg/vortexa
          cp LICENSE pkg/LICENSE
          cp README.md pkg/README.md
          cp data/.gitkeep pkg/data/.gitkeep
          ( cd pkg && zip -r ../vortexa-${{ matrix.name }}.zip vortexa LICENSE README.md data )
          ls -l vortexa-${{ matrix.name }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: vortexa-${{ matrix.name }}
          path: vortexa-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
