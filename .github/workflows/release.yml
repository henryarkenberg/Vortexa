name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: ubuntu-latest
            name: linux-x64
          - os: macos-latest
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --release
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\data | Out-Null
          Copy-Item target\release\vortexa.exe dist\vortexa.exe
          Copy-Item LICENSE README.md dist\
          Copy-Item data\.gitkeep dist\data\.gitkeep
          Compress-Archive -Path dist\* -DestinationPath dist\vortexa-${{ matrix.name }}.zip
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist/data
          cp target/release/vortexa dist/vortexa
          cp LICENSE README.md dist/
          cp data/.gitkeep dist/data/.gitkeep
          zip -r dist/vortexa-${{ matrix.name }}.zip dist
      - uses: actions/upload-artifact@v4
        with:
          name: vortexa-${{ matrix.name }}
          path: dist/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
