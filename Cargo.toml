[package]
name = "vortexa"
version = "0.2.0"
edition = "2021"
description = "Vortexa: a tiny byte-level/BPE RetNet language model built with Candle (CPU/GPU)"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indicatif = "0.17"
ratatui = "0.26"
crossterm = "0.27"

candle-core = "0.9"
candle-nn = "0.9"
mimalloc = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
